name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: build linux/amd64 and linux/arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: build for the smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: ipscanner-forward-auth:ci
      - name: smoke test
        run: |
          docker run -d --name gate -p 8080:8080 ipscanner-forward-auth:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gate)" = healthy ] && break
            sleep 1
          done
          docker inspect -f '{{.State.Health.Status}} {{.Config.User}}' gate | grep -qx 'healthy nonroot:nonroot'
          curl -fsS http://localhost:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 84.128.0.1' http://localhost:8080/check)" = 200
          docker logs gate

  configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: nginx -t on the nginx and NPM configs
        run: |
          cd test/e2e
          docker run --rm --add-host ipscanner:127.0.0.1 --add-host app:127.0.0.1 \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.29-alpine nginx -t
          docker run --rm --add-host ipscanner:127.0.0.1 --add-host app:127.0.0.1 \
            -v "$PWD/npm/proxy-host.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/npm/advanced.conf:/etc/nginx/npm/advanced.conf:ro" \
            -v "$PWD/npm/proxy.conf:/etc/nginx/conf.d/include/proxy.conf:ro" nginx:1.29-alpine nginx -t
      - name: haproxy -c
        run: |
          docker run --rm --add-host ipscanner:127.0.0.1 --add-host app:127.0.0.1 \
            -v "$PWD/test/e2e/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" haproxy:3.2-alpine \
            haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
      - name: caddy validate
        run: |
          docker run --rm -v "$PWD/test/e2e/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
