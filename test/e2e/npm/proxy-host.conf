# The server block Nginx Proxy Manager generates for a proxy host
# (docker/rootfs/etc/nginx/conf.d/include/proxy.conf and the proxy_host
# template, cut to what matters), with the Advanced tab included where NPM
# puts it. Used to test npm/advanced.conf in plain nginx.
resolver 127.0.0.11 valid=10s;

server {
    set $forward_scheme http;
    set $server         "app";
    set $port           80;

    listen 80;
    server_name _;

    include /etc/nginx/npm/advanced.conf;
}
