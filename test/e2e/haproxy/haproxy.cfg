global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web
    bind :80
    option forwardfor
    # Verdict headers come from the gate only, also when the backup serves.
    http-request del-header ^x-ipscanner- -m reg
    default_backend ipscanner

backend ipscanner
    option httpchk GET /healthz
    server gate ipscanner:8080 check inter 2s fall 2 rise 1
    server app app:80 backup
